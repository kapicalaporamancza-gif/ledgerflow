{% extends "base.html" %}
{% block title %}Edycja: {{ client.name }} · LedgerFlow{% endblock %}
{% block body %}
<div style="max-width:560px;margin:0 auto">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
    <div>
      <a href="/clients/{{ client.id }}" class="muted" style="text-decoration:none;margin-bottom:8px;display:inline-block">← Powrót do klienta</a>
      <h1 style="margin:0;font-size:26px">Edycja klienta</h1>
      <p class="muted">{{ client.name }}</p>
    </div>
  </div>

  <form class="card" method="post" action="/clients/{{ client.id }}/edit">
    <div class="form-row form-row-2">
      <div>
        <label>Nazwa firmy *</label>
        <input name="name" required value="{{ client.name }}" autocomplete="organization">
      </div>
      <div>
        <label>Email</label>
        <input name="email" type="email" value="{{ client.email or '' }}" autocomplete="email">
      </div>
    </div>
    <div class="form-row form-row-2">
      <div>
        <label>NIP</label>
        <input name="tax_id" pattern="\d{10}" maxlength="10" value="{{ client.tax_id or '' }}" autocomplete="off">
      </div>
      <div>
        <label>Typ działalności</label>
        <select name="kind">
          <option value="company" {% if client.kind == 'company' %}selected{% endif %}>Spółka</option>
          <option value="sole_prop" {% if client.kind == 'sole_prop' %}selected{% endif %}>JDG</option>
        </select>
      </div>
    </div>
    <div>
      <label>Notatki</label>
      <textarea name="notes" rows="3">{{ client.notes or '' }}</textarea>
    </div>
    <div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap">
      <button class="btn btn-primary" type="submit">Zapisz zmiany</button>
      <a href="/clients/{{ client.id }}" class="btn btn-ghost" style="align-self:center">Anuluj</a>
    </div>
  </form>
</div>
{% endblock %}
